<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6" stroke-dasharray="16 12"/>
  
  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#shadow)">
    <!-- Diamond top -->
    <polygon points="256,100 410,165 256,230 102,165" fill="url(#goldGrad)" />
    <!-- Skull cap underneath -->
    <path d="M 160 195 Q 256 270 352 195 L 352 235 Q 256 310 160 235 Z" fill="#B45309" opacity="0.9"/>
    <!-- Tassel button & cord -->
    <circle cx="256" cy="165" r="9" fill="#FFFFFF"/>
    <path d="M 256 165 C 290 190 320 220 330 270" fill="none" stroke="#FEF3C7" stroke-width="5" stroke-linecap="round"/>
    <rect x="323" y="270" width="14" height="24" rx="4" fill="#FCD34D"/>
  </g>
  
  <!-- Open Book -->
  <g filter="url(#shadow)" transform="translate(0, 20)">
    <!-- Spine shadow -->
    <path d="M 256,290 L 256,415" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
    <!-- Left Page -->
    <path d="M 256,305 C 210,290 145,295 110,310 C 105,312 100,317 100,323 L 100,412 C 100,420 108,426 116,423 C 148,410 205,405 256,420 Z" fill="#FFFFFF"/>
    <!-- Right Page -->
    <path d="M 256,305 C 302,290 367,295 402,310 C 407,312 412,317 412,323 L 412,412 C 412,420 404,426 396,423 C 364,410 307,405 256,420 Z" fill="#F8FAFC"/>
    
    <!-- Page Lines Left -->
    <line x1="135" y1="340" x2="230" y2="335" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="135" y1="365" x2="225" y2="360" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="135" y1="390" x2="210" y2="385" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Page Lines Right -->
    <line x1="282" y1="335" x2="377" y2="340" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="287" y1="360" x2="377" y2="365" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="295" y1="385" x2="350" y2="390" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Star badge in center -->
  <g transform="translate(256, 290) scale(0.9)">
    <circle cx="0" cy="0" r="22" fill="#F59E0B" filter="url(#shadow)"/>
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#FFFFFF"/>
  </g>
</svg>
